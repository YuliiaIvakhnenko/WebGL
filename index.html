<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>PA#3 Textured Drop</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./model_drop.js"></script>
<script src="./main.js"></script>
<script src="./LightSphere.js"></script>

</head>
<body onload="init()">

<h2>Drop Surface with Textures</h2>
<p id="message">Drag your mouse on the drop to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

  <div id="controls">
    <label>U granularity: 
      <input type="range" id="uSlider" min="10" max="100" value="50">
    </label>
    &nbsp;
    <label>V granularity: 
      <input type="range" id="vSlider" min="10" max="100" value="50">
    </label>
  </div>

<div id="canvas-holder">
  <canvas id="webglcanvas" width="600" height="600" style="background-color:white"></canvas>
    <fieldset>
        <legend>Texture</legend>
        <label><input type="checkbox" id="chkDiffuse" checked> Use Diffuse Map</label><br>
        <label><input type="checkbox" id="chkSpecular" checked> Use Specular Map</label><br>
        <label><input type="checkbox" id="chkNormal" checked> Use Normal Map</label>
    </fieldset>
</div>


</body></html>
